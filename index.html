<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LenART">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>LenART — Personal Event Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap');
:root{--bg:#f5f1e9;--paper:#fcfaf6;--paper2:#eee8dd;--line:#e5ded2;--ink:#302d28;--muted:#898174;--taupe:#9c8971;--accent:#806d55;--green:#657b68;--red:#a66d5d;--shadow:0 12px 34px rgba(63,51,36,.06);--radius:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;max-width:1600px;margin:auto}
.sidebar{padding:30px 18px 22px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:30px;background:rgba(252,250,246,.55)}
.brand{padding:2px 12px}.brandname{font:500 29px 'Playfair Display',serif;letter-spacing:.02em}.brandname span{font-weight:600}.brandtag{font-size:9px;letter-spacing:.22em;color:var(--muted);margin-top:5px}
.navlabel{font-size:9px;letter-spacing:.18em;color:#aaa194;padding:0 12px 9px;text-transform:uppercase}
nav{display:grid;gap:4px}.navbtn{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:12px;color:#716a60;display:flex;gap:12px;align-items:center;font-size:13px;transition:.2s}.navbtn:hover{background:#eee8dd}.navbtn.active{background:#e9e1d4;color:#3b352d;font-weight:600}.navbtn .ico{width:19px;text-align:center;font-size:16px;color:#907d64}
.sidebottom{margin-top:auto;padding:16px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.6}
.main{padding:32px clamp(20px,4vw,58px) 90px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}.date{font-size:12px;color:var(--muted)}.mobilebrand{display:none}
h1{font:500 clamp(30px,4vw,43px) 'Playfair Display',serif;margin:8px 0 7px;letter-spacing:-.02em}.subtitle{color:var(--muted);font-size:13px}.headingrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:11px 16px;border-radius:12px;font-weight:600;font-size:12px;transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.btn.primary{background:#79674f;color:#fff;border-color:#79674f}.btn.ghost{background:transparent}.btn.small{padding:7px 10px;font-size:11px}.btn.danger{color:var(--red)}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:25px 0}.card{background:var(--paper);border:1px solid rgba(220,211,198,.75);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}.statlabel{font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.statvalue{font:500 30px 'Playfair Display',serif;margin:10px 0 3px}.statnote{font-size:11px;color:var(--muted)}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px}.sectionhead h2{font:500 21px 'Playfair Display',serif;margin:0}.sectionhead span{font-size:11px;color:var(--muted)}
.eventsgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.eventcard{padding:0;overflow:hidden;cursor:pointer;transition:.2s}.eventcard:hover{transform:translateY(-3px)}.eventcover{height:128px;background:linear-gradient(135deg,#d9cdbb,#eee7dc);position:relative;overflow:hidden}.eventcover:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.25),transparent 60%)}.covermonogram{position:absolute;right:22px;top:20px;font:italic 46px 'Playfair Display',serif;color:rgba(85,69,48,.24)}.eventbody{padding:18px 20px 20px}.eventmeta{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:20px;background:#eee8dd;color:#786b59}.pill.done{background:#e5ece4;color:#5d765f}.eventtitle{font:500 24px 'Playfair Display',serif;margin:12px 0 5px}.eventdesc{font-size:11px;color:var(--muted);min-height:16px}.progressrow{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin:17px 0 7px}.progress{height:4px;background:#e9e3d9;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:#9a866b;border-radius:10px}
.two{grid-template-columns:1.25fr .75fr}.list{display:grid;gap:0}.listitem{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eee9e1}.listitem:last-child{border:0}.dot{width:8px;height:8px;border-radius:50%;background:#a58f72;flex:none}.li-main{min-width:0;flex:1}.li-title{font-size:12px;font-weight:600}.li-sub{font-size:10px;color:var(--muted);margin-top:4px}.empty{padding:28px 15px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.tabs{display:flex;gap:5px;overflow:auto;padding-bottom:8px;margin-bottom:18px}.tab{border:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:10px;white-space:nowrap;font-size:11px}.tab.active{background:#e9e1d4;color:#40382e;font-weight:600}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:10px 12px;min-width:190px;outline:none}
.detailhero{background:linear-gradient(120deg,#e8dfd1,#f1ece3);border-radius:22px;padding:26px;margin-bottom:18px;position:relative;overflow:hidden}.detailhero:after{content:"";position:absolute;width:190px;height:190px;border:1px solid rgba(130,108,78,.18);border-radius:50%;right:-40px;top:-70px;box-shadow:0 0 0 22px rgba(255,255,255,.08),0 0 0 44px rgba(255,255,255,.06)}.detailhero h1{position:relative;z-index:1}.detailhero p{position:relative;z-index:1;color:#776c5d;font-size:12px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fffdf9;color:var(--ink);outline:none}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#a89478;box-shadow:0 0 0 3px rgba(168,148,120,.12)}
.modalback{position:fixed;inset:0;background:rgba(38,34,28,.34);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalback.show{display:flex}.modal{background:var(--paper);border-radius:22px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:24px;box-shadow:0 25px 80px rgba(30,25,18,.2)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalhead h2{font:500 25px 'Playfair Display',serif;margin:0}.close{border:0;background:#eee8dd;border-radius:50%;width:32px;height:32px;font-size:18px;color:#716657}
.tablewrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:11px}.data-table th{text-align:left;color:var(--muted);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:9px;padding:11px 8px;border-bottom:1px solid var(--line)}.data-table td{padding:13px 8px;border-bottom:1px solid #eee9e1;vertical-align:middle}.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.mobilebar{display:none}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;background:#38342e;color:#fff;padding:11px 16px;border-radius:12px;font-size:12px;z-index:40;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.app{display:block}.sidebar{display:none}.main{padding:22px 18px 100px}.mobilebrand{display:block;font:500 22px 'Playfair Display',serif}.topbar{margin-bottom:27px}.date{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:16px}.statvalue{font-size:26px}.eventsgrid,.two{grid-template-columns:1fr}.eventcover{height:112px}.headingrow{align-items:flex-start}.mobilebar{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));background:rgba(252,250,246,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.mobilebar button{border:0;background:none;color:#837a6d;font-size:9px;display:grid;justify-items:center;gap:4px;min-width:48px}.mobilebar button b{font-size:18px;font-weight:400}.mobilebar button.active{color:#5e4d38}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.headingrow .btn{padding:10px 12px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandname">Len<span>ART</span></div><div class="brandtag">PERSONAL EVENT MANAGER</div></div>
  <div><div class="navlabel">Workspace</div><nav id="sidenav"></nav></div>
  <div class="sidebottom">A private space for every occasion.<br><span style="letter-spacing:.14em">LENART · 2026</span></div>
</aside>
<main class="main">
  <div class="topbar"><div class="mobilebrand">LenART</div><div class="date" id="today"></div><div class="toolbar"><button class="btn small" onclick="backupExport()">↗ Kopia zapasowa</button><button class="btn small" onclick="document.getElementById('importFile').click()">↙ Import</button><input id="importFile" type="file" accept="application/json" hidden onchange="backupImport(event)"></div></div>
  <div id="view"></div>
</main>
</div>
<div class="mobilebar" id="mobilebar"></div>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2 id="modaltitle">Nowy wpis</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalcontent"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const NAV=[['home','⌂','Przegląd'],['events','◫','Wydarzenia'],['tasks','☷','Zadania'],['guests','♙','Goście'],['budget','◇','Budżet'],['vendors','✳','Usługodawcy'],['schedule','◷','Harmonogram'],['inspiration','▧','Inspiracje'],['notes','✎','Notatki'],['archive','▤','Archiwum']];
const KEY='lenart-v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{events:[],active:null,section:'home'};
let section=db.section||'home', activeId=db.active||null, sub='overview', searchTerm='';
function save(){db.active=activeId;db.section=section;localStorage.setItem(KEY,JSON.stringify(db));}
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return (Number(n)||0).toLocaleString('pl-PL',{style:'currency',currency:'PLN',maximumFractionDigits:0})}
function datefmt(d){if(!d)return 'Nie ustalono';return new Date(d+'T12:00:00').toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'})}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function eventNow(){return db.events.find(e=>e.id===activeId)}
function progress(e){let tasks=e.tasks||[];return tasks.length?Math.round(tasks.filter(t=>t.done).length/tasks.length*100):0}
function nav(){let html=NAV.map(([id,ic,label])=>`<button class="navbtn ${section===id?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span>${label}</button>`).join('');document.getElementById('sidenav').innerHTML=html;document.getElementById('mobilebar').innerHTML=NAV.slice(0,5).map(([id,ic,label])=>`<button class="${section===id?'active':''}" onclick="go('${id}')"><b>${ic}</b>${label}</button>`).join('')}
function go(s){section=s;activeId=null;save();render()}

function render(){
  nav();
  document.getElementById('today').textContent=new Date().toLocaleDateString('pl-PL',{
    weekday:'long',
    day:'numeric',
    month:'long',
    year:'numeric'
  });

  let v=document.getElementById('view');

  if(section==='home'){
    v.innerHTML=home();
  }else if(activeId&&eventNow()){
    v.innerHTML=detailPage();
  }else if(section==='events'){
    v.innerHTML=eventsPage();
  }else if(section==='archive'){
    v.innerHTML=archivePage();
  }else{
    v.innerHTML=globalPage();
  }

  bindSearch();
}

function home(){let upcoming=db.events.filter(e=>e.status!=='done').sort((a,b)=>(a.date||'').localeCompare(b.date||''));let taskCount=upcoming.reduce((a,e)=>a+(e.tasks||[]).filter(t=>!t.done).length,0);let total=upcoming.reduce((a,e)=>a+(e.expenses||[]).reduce((s,x)=>s+Number(x.amount||0),0),0);return `<div class="eyebrow">PERSONAL WORKSPACE</div><div class="headingrow"><div><h1>Dzień dobry.</h1><div class="subtitle">Wszystkie ważne okazje, w jednym miejscu.</div></div><button class="btn primary" onclick="newEvent()">＋ Nowe wydarzenie</button></div>
<div class="grid stats"><div class="card"><div class="statlabel">Aktywne wydarzenia</div><div class="statvalue">${upcoming.length}</div><div class="statnote">Twoje bieżące projekty</div></div><div class="card"><div class="statlabel">Otwarte zadania</div><div class="statvalue">${taskCount}</div><div class="statnote">Rzeczy do dopięcia</div></div><div class="card"><div class="statlabel">Zarejestrowane wydatki</div><div class="statvalue">${money(total)}</div><div class="statnote">Łącznie w aktywnych projektach</div></div><div class="card"><div class="statlabel">Wszystkie wydarzenia</div><div class="statvalue">${db.events.length}</div><div class="statnote">Aktywne i archiwalne</div></div></div>
<div class="sectionhead"><h2>Twoje wydarzenia</h2><span>${upcoming.length} aktywne</span></div>${upcoming.length?`<div class="grid eventsgrid">${upcoming.slice(0,4).map(eventCard).join('')}</div>`:`<div class="card empty">Nie masz jeszcze żadnych wydarzeń.<br>Utwórz pierwsze wydarzenie i zacznij planowanie.</div>`}
<div class="grid two"><div><div class="sectionhead"><h2>Najbliższe terminy</h2><span>Otwarte zadania</span></div><div class="card">${taskList(upcoming.flatMap(e=>(e.tasks||[]).filter(t=>!t.done).map(t=>({...t,eventName:e.name,eventId:e.id}))).slice(0,5))}</div></div><div><div class="sectionhead"><h2>Szybki dostęp</h2></div><div class="card list">${NAV.slice(1,7).map(([id,ic,label])=>`<div class="listitem" style="cursor:pointer" onclick="go('${id}')"><span class="dot"></span><div class="li-main"><div class="li-title">${label}</div><div class="li-sub">Otwórz moduł</div></div><span style="color:#a89b88">→</span></div>`).join('')}</div></div></div>`}
function eventCard(e){return `<div class="card eventcard" onclick="openEvent('${e.id}')"><div class="eventcover"><div class="covermonogram">${esc((e.name||'E').slice(0,1).toUpperCase())}</div></div><div class="eventbody"><div class="eventmeta"><span class="pill">${e.status==='done'?'Zakończone':'W przygotowaniu'}</span><span class="date">${datefmt(e.date)}</span></div><div class="eventtitle">${esc(e.name)}</div><div class="eventdesc">${esc(e.type||'Wydarzenie')}${e.place?' · '+esc(e.place):''}</div><div class="progressrow"><span>Postęp przygotowań</span><b>${progress(e)}%</b></div><div class="progress"><i style="width:${progress(e)}%"></i></div></div></div>`}
function eventsPage(){return `<div class="eyebrow">YOUR OCCASIONS</div><div class="headingrow"><div><h1>Wydarzenia</h1><div class="subtitle">Każde wydarzenie ma własną przestrzeń i plan.</div></div><button class="btn primary" onclick="newEvent()">＋ Dodaj wydarzenie</button></div><div class="toolbar" style="margin-bottom:18px"><input class="search" id="search" placeholder="Szukaj wydarzenia…" value="${esc(searchTerm)}"></div><div class="grid eventsgrid" id="eventlist">${db.events.filter(e=>e.status!=='done').filter(e=>(e.name+' '+(e.type||'')).toLowerCase().includes(searchTerm.toLowerCase())).map(eventCard).join('')||'<div class="card empty">Brak wydarzeń. Dodaj pierwsze.</div>'}</div>`}
function archivePage(){let arr=db.events.filter(e=>e.status==='done');return `<div class="eyebrow">YOUR HISTORY</div><div class="headingrow"><div><h1>Archiwum</h1><div class="subtitle">Zakończone wydarzenia i wspomnienia.</div></div></div><div class="grid eventsgrid">${arr.map(eventCard).join('')||'<div class="card empty">Archiwum jest jeszcze puste.</div>'}</div>`}
function openEvent(id){activeId=id;section='events';sub='overview';save();render()}
function detailPage(){let e=eventNow();let tabs=[['overview','Przegląd'],['tasks','Zadania'],['guests','Goście'],['budget','Budżet'],['vendors','Usługodawcy'],['schedule','Harmonogram'],['inspiration','Inspiracje'],['notes','Notatki']];return `<div class="toolbar" style="margin-bottom:18px"><button class="btn ghost small" onclick="activeId=null;render()">← Wszystkie wydarzenia</button><span class="date">EVENT WORKSPACE</span></div><div class="detailhero"><div class="eyebrow">YOUR EVENT</div><h1>${esc(e.name)}</h1><p>${esc(e.type||'Wydarzenie')} · ${datefmt(e.date)} ${e.place?'· '+esc(e.place):''}</p></div><div class="tabs">${tabs.map(([id,n])=>`<button class="tab ${sub===id?'active':''}" onclick="sub='${id}';render()">${n}</button>`).join('')}</div>${detailContent(e)}</div>`}
function detailContent(e){if(sub==='overview')return `<div class="grid stats"><div class="card"><div class="statlabel">Goście</div><div class="statvalue">${(e.guests||[]).length}</div><div class="statnote">Dodane osoby</div></div><div class="card"><div class="statlabel">Zadania</div><div class="statvalue">${(e.tasks||[]).filter(t=>!t.done).length}</div><div class="statnote">Pozostało do zrobienia</div></div><div class="card"><div class="statlabel">Wydatki</div><div class="statvalue">${money((e.expenses||[]).reduce((s,x)=>s+Number(x.amount||0),0))}</div><div class="statnote">Zarejestrowane koszty</div></div><div class="card"><div class="statlabel">Postęp</div><div class="statvalue">${progress(e)}%</div><div class="statnote">Ukończone zadania</div></div></div><div class="grid two"><div class="card"><div class="sectionhead" style="margin-top:0"><h2>Opis wydarzenia</h2><button class="btn small" onclick="editEvent()">Edytuj</button></div><p style="color:var(--muted);font-size:12px;line-height:1.7">${esc(e.description||'Dodaj opis wydarzenia, motyw przewodni i najważniejsze informacje.')}</p><div class="li-sub">MIEJSCE</div><div style="margin:6px 0 15px">${esc(e.place||'Nie ustalono')}</div><div class="li-sub">BUDŻET PLANOWANY</div><div style="font:24px 'Playfair Display',serif;margin-top:6px">${money(e.budget)}</div></div><div class="card"><div class="sectionhead" style="margin-top:0"><h2>Następne zadania</h2><button class="btn small" onclick="sub='tasks';render()">Wszystkie</button></div>${taskList((e.tasks||[]).filter(t=>!t.done).slice(0,5),true)}</div></div><div class="sectionhead"><h2>Szybkie działania</h2></div><div class="toolbar">${[['tasks','＋ Zadanie'],['guests','＋ Gość'],['budget','＋ Wydatek'],['vendors','＋ Usługodawca'],['schedule','＋ Punkt harmonogramu'],['notes','＋ Notatka']].map(([s,l])=>`<button class="btn" onclick="sub='${s}';render();if('${s}'!=='tasks'){}">${l}</button>`).join('')}</div>`;
if(sub==='tasks')return listModule(e,'tasks','Zadania','＋ Dodaj zadanie',newTask,t=>`<div class="listitem"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><div class="li-main"><div class="li-title" style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.title)}</div><div class="li-sub">${esc(t.priority||'Normalny priorytet')} · ${t.due?datefmt(t.due):'Bez terminu'}</div></div><button class="btn small danger" onclick="removeItem('tasks','${t.id}')">Usuń</button></div>`);
if(sub==='guests')return listModule(e,'guests','Goście','＋ Dodaj gościa',newGuest,g=>`<div class="listitem"><div class="li-main"><div class="li-title">${esc(g.name)}</div><div class="li-sub">${esc(g.group||'Bez grupy')} · ${esc(g.phone||'Brak telefonu')} · ${esc(g.rsvp||'Niepotwierdzony')}</div></div><button class="btn small" onclick="editGuest('${g.id}')">Edytuj</button><button class="btn small danger" onclick="removeItem('guests','${g.id}')">×</button></div>`);
if(sub==='budget')return `<div class="headingrow"><div><h2 style="font:500 25px 'Playfair Display',serif">Budżet wydarzenia</h2><div class="subtitle">Kontroluj planowane koszty i rzeczywiste wydatki.</div></div><button class="btn primary" onclick="newExpense()">＋ Dodaj wydatek</button></div><div class="grid stats"><div class="card"><div class="statlabel">Budżet planowany</div><div class="statvalue">${money(e.budget)}</div></div><div class="card"><div class="statlabel">Wydano</div><div class="statvalue">${money((e.expenses||[]).reduce((s,x)=>s+ +x.amount,0))}</div></div><div class="card"><div class="statlabel">Pozostało</div><div class="statvalue">${money(Number(e.budget||0)-(e.expenses||[]).reduce((s,x)=>s+ +x.amount,0))}</div></div><div class="card"><div class="statlabel">Pozycje kosztowe</div><div class="statvalue">${(e.expenses||[]).length}</div></div></div><div class="card tablewrap"><table class="data-table"><thead><tr><th>Wydatek</th><th>Kategoria</th><th>Kwota</th><th>Status</th><th></th></tr></thead><tbody>${(e.expenses||[]).map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.category||'Inne')}</td><td class="money">${money(x.amount)}</td><td>${esc(x.status||'Do zapłaty')}</td><td><button class="btn small danger" onclick="removeItem('expenses','${x.id}')">Usuń</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nie dodano jeszcze wydatków.</td></tr>'}</tbody></table></div>`;
if(sub==='vendors')return listModule(e,'vendors','Usługodawcy','＋ Dodaj usługodawcę',newVendor,v=>`<div class="listitem"><div class="li-main"><div class="li-title">${esc(v.name)}</div><div class="li-sub">${esc(v.type||'Usługodawca')} · ${esc(v.phone||v.email||'Brak kontaktu')} · ${v.price?money(v.price):'Cena nieustalona'}</div></div><button class="btn small danger" onclick="removeItem('vendors','${v.id}')">Usuń</button></div>`);
if(sub==='schedule')return listModule(e,'schedule','Harmonogram','＋ Dodaj punkt',newSchedule,s=>`<div class="listitem"><div class="dot"></div><div class="li-main"><div class="li-title">${esc(s.time||'--:--')} · ${esc(s.title)}</div><div class="li-sub">${esc(s.description||'')}</div></div><button class="btn small danger" onclick="removeItem('schedule','${s.id}')">Usuń</button></div>`,true);
if(sub==='inspiration')return listModule(e,'inspiration','Inspiracje','＋ Dodaj inspirację',newInspiration,i=>`<div class="listitem"><div class="li-main"><div class="li-title">${esc(i.title)}</div><div class="li-sub">${esc(i.description||i.url||'')}</div></div>${i.url?`<a class="btn small" href="${esc(i.url)}" target="_blank">Otwórz</a>`:''}<button class="btn small danger" onclick="removeItem('inspiration','${i.id}')">Usuń</button></div>`);
if(sub==='notes')return listModule(e,'notes','Notatki','＋ Dodaj notatkę',newNote,n=>`<div class="listitem"><div class="li-main"><div class="li-title">${esc(n.title)}</div><div class="li-sub">${esc(n.body||'')}</div></div><button class="btn small danger" onclick="removeItem('notes','${n.id}')">Usuń</button></div>`);
}
function listModule(e,key,title,button,action,row,sort=false){let arr=[...(e[key]||[])];if(sort)arr.sort((a,b)=>(a.time||'').localeCompare(b.time||''));return `<div class="headingrow"><div><h2 style="font:500 25px 'Playfair Display',serif">${title}</h2><div class="subtitle">${arr.length} pozycji</div></div><button class="btn primary" onclick="${action.name}()"> ${button}</button></div><div class="card list">${arr.map(row).join('')||`<div class="empty">Nie ma jeszcze żadnych pozycji.</div>`}</div>`}
function taskList(arr,compact=false){return arr.length?`<div class="list">${arr.map(t=>`<div class="listitem"><span class="dot"></span><div class="li-main"><div class="li-title">${esc(t.title)}</div><div class="li-sub">${esc(t.eventName||'')} ${t.due?'· '+datefmt(t.due):''}</div></div></div>`).join('')}</div>`:'<div class="empty">Brak otwartych zadań. Możesz chwilę odetchnąć.</div>'}
function globalPage(){let all=db.events.flatMap(e=>(e[section]||[]).map(x=>({...x,eventName:e.name,eventId:e.id})));let labels={tasks:'Zadania',guests:'Goście',budget:'Budżety',vendors:'Usługodawcy',schedule:'Harmonogram',inspiration:'Inspiracje',notes:'Notatki'};return `<div class="eyebrow">ALL EVENTS</div><div class="headingrow"><div><h1>${labels[section]||section}</h1><div class="subtitle">Zestawienie ze wszystkich Twoich wydarzeń.</div></div></div><div class="card list">${all.length?all.map(x=>`<div class="listitem" style="cursor:pointer" onclick="openEvent('${x.eventId}')"><span class="dot"></span><div class="li-main"><div class="li-title">${esc(x.title||x.name||x.eventName)}</div><div class="li-sub">${esc(x.eventName)}${x.due?' · '+datefmt(x.due):''}</div></div><span>→</span></div>`).join(''):'<div class="empty">Dodaj pozycje wewnątrz konkretnego wydarzenia, aby pojawiły się tutaj.</div>'}</div>`}
function bindSearch(){let s=document.getElementById('search');if(s)s.oninput=()=>{searchTerm=s.value;let list=document.getElementById('eventlist');list.innerHTML=db.events.filter(e=>e.status!=='done').filter(e=>(e.name+' '+(e.type||'')).toLowerCase().includes(searchTerm.toLowerCase())).map(eventCard).join('')||'<div class="card empty">Brak wyników.</div>'}}
function openModal(title,html,submit){document.getElementById('modaltitle').textContent=title;document.getElementById('modalcontent').innerHTML=html;document.getElementById('modalcontent').onsubmit=submit;document.getElementById('modalback').classList.add('show')}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
function field(label,name,type='text',value='',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function newEvent(){openModal('Nowe wydarzenie',`<form id="f" class="formgrid">${field('Nazwa wydarzenia','name')}${field('Typ wydarzenia','type','text','Impreza')}${field('Data','date','date')}${field('Miejsce','place')}${field('Planowany budżet (PLN)','budget','number','0') }<div class="field full"><label>Opis / motyw przewodni</label><textarea name="description" placeholder="Najważniejsze informacje, klimat, pomysły…"></textarea></div><div class="field full"><button class="btn primary">Utwórz wydarzenie</button></div></form>`,ev=>{ev.preventDefault();let f=new FormData(ev.target);let e={id:uid(),name:f.get('name')||'Nowe wydarzenie',type:f.get('type'),date:f.get('date'),place:f.get('place'),budget:+f.get('budget'),description:f.get('description'),status:'active',tasks:[],guests:[],expenses:[],vendors:[],schedule:[],inspiration:[],notes:[]};db.events.push(e);activeId=e.id;section='events';sub='overview';save();closeModal();render();toast('Utworzono wydarzenie')})}
function editEvent(){let e=eventNow();openModal('Edytuj wydarzenie',`<form id="f" class="formgrid">${field('Nazwa','name','text',e.name)}${field('Typ','type','text',e.type)}${field('Data','date','date',e.date)}${field('Miejsce','place','text',e.place)}${field('Budżet (PLN)','budget','number',e.budget)}<div class="field full"><label>Opis</label><textarea name="description">${esc(e.description||'')}</textarea></div><div class="field full"><label>Status</label><select name="status"><option value="active" ${e.status!=='done'?'selected':''}>W przygotowaniu</option><option value="done" ${e.status==='done'?'selected':''}>Zakończone</option></select></div><div class="field full"><button class="btn primary">Zapisz zmiany</button></div></form>`,ev=>{ev.preventDefault();let f=new FormData(ev.target);Object.assign(e,Object.fromEntries(f));e.budget=+e.budget;save();closeModal();render();toast('Zapisano zmiany')})}
function newTask(){openModal('Nowe zadanie',`<form class="formgrid">${field('Nazwa zadania','title')}${field('Termin','due','date')}<div class="field"><label>Priorytet</label><select name="priority"><option>Niski</option><option selected>Normalny</option><option>Wysoki</option></select></div><div class="field full"><button class="btn primary">Dodaj zadanie</button></div></form>`,ev=>{ev.preventDefault();let f=new FormData(ev.target);eventNow().tasks.push({id:uid(),title:f.get('title'),due:f.get('due'),priority:f.get('priority'),done:false});save();closeModal();render()})}
function toggleTask(id,val){let t=eventNow().tasks.find(x=>x.id===id);if(t)t.done=val;save();render()}
function newGuest(){openModal('Dodaj gościa',`<form class="formgrid">${field('Imię i nazwisko','name')}${field('Telefon','phone','tel')}<div class="field"><label>Grupa</label><select name="group"><option>Rodzina</option><option>Znajomi</option><option>Szkoła</option><option>Inne</option></select></div><div class="field"><label>Potwierdzenie</label><select name="rsvp"><option>Niepotwierdzony</option><option>Potwierdzony</option><option>Odmowa</option></select></div><div class="field full"><button class="btn primary">Dodaj gościa</button></div></form>`,ev=>{ev.preventDefault();let f=new FormData(ev.target);eventNow().guests.push({id:uid(),...Object.fromEntries(f)});save();closeModal();render()})}
function editGuest(id){let g=eventNow().guests.find(x=>x.id===id);if(!g)return;openModal('Edytuj gościa',`<form class="formgrid">${field('Imię i nazwisko','name','text',g.name)}${field('Telefon','phone','tel',g.phone)}<div class="field"><label>Grupa</label><select name="group">${['Rodzina','Znajomi','Szkoła','Inne'].map(x=>`<option ${g.group===x?'selected':''}>${x}</option>`)}</select></div><div class="field"><label>Potwierdzenie</label><select name="rsvp">${['Niepotwierdzony','Potwierdzony','Odmowa'].map(x=>`<option ${g.rsvp===x?'selected':''}>${x}</option>`)}</select></div><div class="field full"><button class="btn primary">Zapisz</button></div></form>`,ev=>{ev.preventDefault();Object.assign(g,Object.fromEntries(new FormData(ev.target)));save();closeModal();render()})}
function newExpense(){openModal('Dodaj wydatek',`<form class="formgrid">${field('Nazwa wydatku','title')}${field('Kwota (PLN)','amount','number','0')}<div class="field"><label>Kategoria</label><select name="category"><option>Sala</option><option>Muzyka</option><option>Jedzenie</option><option>Dekoracje</option><option>Fotografia</option><option>Transport</option><option>Inne</option></select></div><div class="field"><label>Status</label><select name="status"><option>Do zapłaty</option><option>Opłacone</option><option>Zaliczka wpłacona</option></select></div><div class="field full"><button class="btn primary">Dodaj wydatek</button></div></form>`,ev=>{ev.preventDefault();let f=new FormData(ev.target);eventNow().expenses.push({id:uid(),...Object.fromEntries(f)});save();closeModal();render()})}
function newVendor(){openModal('Dodaj usługodawcę',`<form class="formgrid">${field('Nazwa / osoba','name')}${field('Telefon','phone','tel')}${field('E-mail','email','email')}<div class="field"><label>Usługa</label><select name="type"><option>Sala</option><option>DJ / zespół</option><option>Fotograf</option><option>Kamerzysta</option><option>Catering</option><option>Dekoracje</option><option>Transport</option><option>Inne</option></select></div>${field('Cena (PLN)','price','number','0')}<div class="field full"><label>Uwagi</label><textarea name="notes"></textarea></div><div class="field full"><button class="btn primary">Dodaj usługodawcę</button></div></form>`,ev=>{ev.preventDefault();let f=new FormData(ev.target);eventNow().vendors.push({id:uid(),...Object.fromEntries(f)});save();closeModal();render()})}
function newSchedule(){openModal('Punkt harmonogramu',`<form class="formgrid">${field('Godzina','time','time')}${field('Punkt programu','title')}<div class="field full"><label>Opis</label><textarea name="description"></textarea></div><div class="field full"><button class="btn primary">Dodaj do harmonogramu</button></div></form>`,ev=>{ev.preventDefault();let f=new FormData(ev.target);eventNow().schedule.push({id:uid(),...Object.fromEntries(f)});save();closeModal();render()})}
function newInspiration(){openModal('Dodaj inspirację',`<form class="formgrid">${field('Tytuł','title')}${field('Link (opcjonalnie)','url','url')}<div class="field full"><label>Opis / pomysł</label><textarea name="description"></textarea></div><div class="field full"><button class="btn primary">Zapisz inspirację</button></div></form>`,ev=>{ev.preventDefault();let f=new FormData(ev.target);eventNow().inspiration.push({id:uid(),...Object.fromEntries(f)});save();closeModal();render()})}
function newNote(){openModal('Nowa notatka',`<form class="formgrid">${field('Tytuł','title')}<div class="field full"><label>Treść</label><textarea name="body" style="min-height:150px"></textarea></div><div class="field full"><button class="btn primary">Zapisz notatkę</button></div></form>`,ev=>{ev.preventDefault();let f=new FormData(ev.target);eventNow().notes.push({id:uid(),...Object.fromEntries(f)});save();closeModal();render()})}
function removeItem(key,id){if(!confirm('Usunąć tę pozycję?'))return;let e=eventNow();e[key]=e[key].filter(x=>x.id!==id);save();render();toast('Usunięto pozycję')}
function backupExport(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lenart-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Przygotowano kopię zapasową')}
function backupImport(ev){let file=ev.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.events))throw Error();if(confirm('Import zastąpi obecne dane. Kontynuować?')){db=d;activeId=null;section='home';save();render();toast('Zaimportowano kopię')}}catch(e){alert('Nie udało się odczytać kopii LenART.')}};r.readAsText(file);ev.target.value=''}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
